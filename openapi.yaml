openapi: 3.1.0
info:
  title: 100/100 Study Sync API
  version: 0.1.0
  description: Accepts validated CBSE study events only. Does not accept chat transcripts or arbitrary conversation content.
servers:
  - url: https://YOUR-API-HOST.example
security:
  - BearerAuth: []
paths:
  /health:
    get:
      security: []
      operationId: healthCheck
      summary: Check whether the study API is online
      responses:
        '200':
          description: API health
  /api/study-sync:
    post:
      operationId: submitStudyEvents
      summary: Submit explicitly authorized study progress events
      description: Submit one event or a batch of up to 25 study-only events. Never submit personal conversation text or transcripts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/StudyEvent'
                - type: array
                  minItems: 1
                  maxItems: 25
                  items:
                    $ref: '#/components/schemas/StudyEvent'
      responses:
        '202':
          description: Events accepted for storage
        '400':
          description: Invalid or non-study payload
        '401':
          description: Unauthorized
        '503':
          description: API secret is not configured
    get:
      operationId: listRecentStudyEvents
      summary: Read recent stored study events
      responses:
        '200':
          description: Recent validated study events
        '401':
          description: Unauthorized
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    StudyEvent:
      type: object
      additionalProperties: false
      required: [type, subject, chapter]
      properties:
        type:
          type: string
          enum: [chapter_status, quiz_result, weak_topic, study_session]
        subject:
          type: string
          enum: [Maths, Science, SST, English, Hindi, AI]
        chapter:
          type: string
          maxLength: 180
        topic:
          type: string
          maxLength: 180
        status:
          type: string
          enum: [not_started, learning, revised]
        score:
          type: number
          minimum: 0
        total:
          type: number
          exclusiveMinimum: 0
        session:
          type: string
          maxLength: 80
        date:
          type: string
          pattern: '^\\d{4}-\\d{2}-\\d{2}$'
        source:
          type: string
          enum: [chatgpt]
        event_id:
          type: string
          maxLength: 100
